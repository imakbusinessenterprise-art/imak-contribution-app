<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — iMak</title>
  <meta name="theme-color" content="#0B4D2C">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="logo-circle">iM</div>
    <h1>iMak Business Enterprise</h1>
  </header>

  <main class="home-content">
    <h2>Create Account</h2>
    <p class="subtitle">Fill in your details to get started.</p>

    <div class="card">
      <form id="register-form">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter your phone number" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>

        <p id="register-message" class="form-message"></p>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <p class="switch-text">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <footer class="app-footer">
    <p>&copy; 2026 iMak Business Enterprise — Demo Version</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
