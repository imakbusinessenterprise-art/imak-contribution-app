<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — iMak</title>
  <meta name="theme-color" content="#0B4D2C">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="logo-circle">iM</div>
    <h1>iMak Business Enterprise</h1>
  </header>

  <main class="home-content">
    <p class="subtitle" id="welcome-text">Loading...</p>

    <div class="balance-card">
      <p class="balance-label">Current Balance</p>
      <p class="balance-amount" id="balance-amount">₦0.00</p>
      <p class="balance-label" id="total-contributions">Total Contributions: ₦0.00</p>
    </div>

    <div class="plan-grid">
      <div class="plan-card">
        <p class="plan-name">Daily Plan</p>
        <p class="plan-amount">₦500 min</p>
      </div>
      <div class="plan-card">
        <p class="plan-name">Weekly Plan</p>
        <p class="plan-amount">₦2,000 min</p>
      </div>
      <div class="plan-card">
        <p class="plan-name">Monthly Plan</p>
        <p class="plan-amount">₦5,000 min</p>
      </div>
      <div class="plan-card">
        <p class="plan-name">Pending Withdrawal</p>
        <p class="plan-amount">₦0.00</p>
      </div>
    </div>

    <div class="card">
      <h3>Recent Contributions</h3>
      <div id="recent-list">
        <p class="empty-text">Loading...</p>
      </div>
    </div>

    <a href="admin.html" class="btn-secondary">Admin Dashboard</a>
    <button id="logout-btn" class="btn-secondary logout-space">Logout</button>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active">Dashboard</a>
    <a href="contributions.html" class="nav-item">Contribute</a>
    <a href="payment.html" class="nav-item">Payment</a>
    <a href="withdrawal.html" class="nav-item">Withdraw</a>
    <a href="profile.html" class="nav-item">Profile</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
