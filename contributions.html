<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contribute — iMak</title>
  <meta name="theme-color" content="#0B4D2C">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="logo-circle">iM</div>
    <h1>iMak Business Enterprise</h1>
  </header>

  <main class="home-content">
    <h2>Make a Contribution</h2>
    <p class="subtitle">Choose a plan and enter your amount.</p>

    <div class="plan-select-grid" id="plan-select-grid">
      <p class="empty-text">Loading plans...</p>
    </div>

    <div class="card">
      <form id="contribution-form">
        <p class="selected-plan-text" id="selected-plan-text">No plan selected yet.</p>

        <div id="amount-options-grid" class="plan-select-grid" style="display:none;"></div>

        <label for="amount">Amount (₦)</label>
        <input type="number" id="amount" placeholder="Enter amount, or tap a suggestion above" required>

        <p id="contribution-message" class="form-message"></p>

        <button type="submit" class="btn-primary">Continue to Payment</button>
      </form>
    </div>

    <div class="card">
      <h3>Your Contribution History</h3>
      <div id="history-list">
        <p class="empty-text">Loading...</p>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">Dashboard</a>
    <a href="contributions.html" class="nav-item active">Contribute</a>
    <a href="payment.html" class="nav-item">Payment</a>
    <a href="withdrawal.html" class="nav-item">Withdraw</a>
    <a href="profile.html" class="nav-item">Profile</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/contributions.js"></script>
</body>
</html>
