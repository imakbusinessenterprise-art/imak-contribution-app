<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Care — iMak</title>
  <meta name="theme-color" content="#0B4D2C">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="logo-circle">iM</div>
    <h1>iMak Business Enterprise</h1>
  </header>

  <main class="home-content">
    <h2>Customer Care</h2>
    <p class="subtitle">Send us a message and we'll get back to you.</p>

    <div class="card">
      <div id="chat-list" class="chat-container">
        <p class="empty-text">Loading conversation...</p>
      </div>
    </div>

    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="Type your message..." required>
      <button type="submit" class="btn-primary">Send</button>
    </form>

    <a href="dashboard.html" class="btn-secondary logout-space">Back to Dashboard</a>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/support.js"></script>
</body>
</html>
